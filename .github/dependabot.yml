version: 2
updates:
  - package-ecosystem: gomod
    directory: /api
    schedule: { interval: weekly }
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      web:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: terraform
    directory: /infra
    schedule: { interval: weekly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }

  - package-ecosystem: docker
    directories: [/api, /web]
    schedule: { interval: weekly }
