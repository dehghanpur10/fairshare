# Deploys main to AWS. Needs the repository variables printed by
# `terraform output github_actions_variables`; until they exist every job is
# skipped, so forks and fresh clones stay green.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Never run two deploys at once, and never cancel one halfway through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}

jobs:
  api-image:
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-24.04-arm
    environment: production
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - id: tag
        run: echo "image=${{ vars.ECR_REPOSITORY_URL }}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: api
          platforms: linux/arm64
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  api:
    needs: api-image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Copy the latest revision (Terraform owns everything but the image) and
      # swap in the image we just pushed.
      - name: Register task definition
        id: taskdef
        env:
          FAMILY: ${{ vars.ECS_TASK_FAMILY }}
          IMAGE: ${{ needs.api-image.outputs.image }}
        run: |
          aws ecs describe-task-definition --task-definition "$FAMILY" --query taskDefinition > current.json
          jq --arg image "$IMAGE" '
            .containerDefinitions[0].image = $image
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy)
          ' current.json > next.json
          arn=$(aws ecs register-task-definition --cli-input-json file://next.json \
            --query taskDefinition.taskDefinitionArn --output text)
          echo "arn=$arn" >> "$GITHUB_OUTPUT"

      # Migrations run before new code takes traffic, so they must stay
      # compatible with the version still serving (expand, then contract).
      - name: Run migrations
        env:
          TASK_DEF: ${{ steps.taskdef.outputs.arn }}
          SUBNETS: ${{ vars.ECS_SUBNETS }}
          SECURITY_GROUP: ${{ vars.ECS_SECURITY_GROUP }}
        run: |
          task=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$TASK_DEF" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUP],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"api","command":["migrate"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$task"
          code=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$task" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          echo "migrate exited with $code"
          test "$code" = "0"

      - name: Roll out
        env:
          TASK_DEF: ${{ steps.taskdef.outputs.arn }}
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEF" > /dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
          # The circuit breaker rolls back a failing deploy, and a rolled-back
          # service is also "stable", so check which revision actually won.
          primary=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].deployments[?status==`PRIMARY`].taskDefinition | [0]' --output text)
          if [ "$primary" != "$TASK_DEF" ]; then
            echo "::error::Deployment was rolled back to $primary"
            exit 1
          fi

  # The UI goes out after the API so a new UI never talks to an old API.
  web:
    needs: api
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      # Fingerprinted assets first, cached forever and never deleted, so
      # anyone still on the previous index.html can load its files. Then the
      # app shell, which browsers must revalidate.
      - name: Upload to S3
        env:
          BUCKET: ${{ vars.WEB_BUCKET }}
        run: |
          aws s3 sync dist/assets "s3://$BUCKET/assets" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist "s3://$BUCKET" --exclude "assets/*" --delete \
            --cache-control "no-cache"
      - name: Invalidate the app shell
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/index.html" > /dev/null
