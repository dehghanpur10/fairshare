# Mirrors the CloudFront setup: one origin serves the app and proxies /v1 to
# the API, so the browser never makes a cross-origin request.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /v1/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Vite fingerprints everything under /assets, so it can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routes fall back to index.html, which must always revalidate.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
